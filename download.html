<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev World - Download Launcher</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #5ce1e6;
            background-image: url('https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/Untitled338_20260812133205.png?raw=true');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #212529;
            font-family: 'Cherry Bomb One', cursive, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        .clouds-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image: url('https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/Untitled338_20260812133205.png?raw=true');
            background-repeat: repeat-x;
            background-size: contain;
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border: 4px solid #000000;
            border-radius: 20px;
            box-shadow: 0 8px 0px #000000;
            padding: 30px 20px;
            text-align: center;
        }

        .download-img {
            max-width: 280px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 20px auto;
            filter: drop-shadow(3px 3px 0px #000);
            image-rendering: pixelated;
        }

        .header-title {
            font-size: 26px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        .sub-text {
            font-size: 16px;
            color: #333;
            margin-bottom: 25px;
        }

        .btn-custom {
            width: 100%;
            max-width: 320px;
            padding: 14px;
            border: 3px solid #000;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            margin: 0 auto 15px auto;
            text-decoration: none;
            display: block;
            text-align: center;
            font-family: 'Cherry Bomb One', cursive, sans-serif;
        }

        .btn-custom:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }

        .btn-launcher { background: #bfffe7; color: #000; }
        .btn-home { background: #b4ffe4; color: #000; margin-bottom: 0; }
    </style>
</head>
<body>

    <div class="clouds-bg"></div>

    <div class="main-container">
        <!-- Uses your hand-drawn download.png image -->
        <img src="download.png" alt="Windows Dev World Launcher" class="download-img" onerror="this.src='Devworldlogobeta.png'">
        
        <h3 class="header-title">Launcher for Windows</h3>
        <p class="sub-text">Get the official Windows app</p>

        <!-- Main Launcher Download Button -->
        <a href="#" class="btn-custom btn-launcher" onclick="alert('Download starting soon...'); return false;">Launcher</a>
        
        <a href="home.html" class="btn-custom btn-home">Back to Home</a>
    </div>

</body>
</html>
