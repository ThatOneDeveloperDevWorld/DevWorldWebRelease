name: Build Android Release

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm install

      - name: Organize Web Files for Capacitor
        run: |
          mkdir -p www
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'android' ! -name 'www' ! -name 'package.json' ! -name 'package-lock.json' ! -name 'icon.png' -exec mv -t www/ {} +

      - name: Initialize Capacitor and Add Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Dev World" com.devworld.app --web-dir www
          npx cap add android

      - name: Process and Apply App Icon via Python
        run: |
          python3 -c "
          import os
          from PIL import Image

          icon_path = 'icon.png'
          if os.path.exists(icon_path):
              img = Image.open(icon_path).convert('RGBA')
              
              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192
              }
              
              base_dir = 'android/app/src/main/res'
              for folder, size in sizes.items():
                  res_dir = os.path.join(base_dir, folder)
                  os.makedirs(res_dir, exist_ok=True)
                  
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(res_dir, 'ic_launcher.png'), 'PNG')
                  resized.save(os.path.join(res_dir, 'ic_launcher_round.png'), 'PNG')
              print('Successfully generated and applied custom app icons!')
          else:
              print('icon.png not found, skipping custom icon generation.')
          "

      - name: Sync Capacitor
        run: |
          npx cap sync

      - name: Decode Release Keystore from GitHub Secrets
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/devworldrelease.jks

      - name: Inject Signing Configuration into Gradle
        run: |
          echo "" >> android/app/build.gradle
          echo "android {" >> android/app/build.gradle
          echo "    signingConfigs {" >> android/app/build.gradle
          echo "        release {" >> android/app/build.gradle
          echo "            storeFile file('devworldrelease.jks')" >> android/app/build.gradle
          echo "            storePassword '${{ secrets.RELEASE_KEYSTORE_PASSWORD }}'" >> android/app/build.gradle
          echo "            keyAlias '${{ secrets.RELEASE_KEY_ALIAS }}'" >> android/app/build.gradle
          echo "            keyPassword '${{ secrets.RELEASE_KEY_PASSWORD }}'" >> android/app/build.gradle
          echo "        }" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "    buildTypes {" >> android/app/build.gradle
          echo "        release {" >> android/app/build.gradle
          echo "            signingConfig signingConfigs.release" >> android/app/build.gradle
          echo "        }" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Fix Kotlin Version Conflicts
        run: |
          echo "" >> android/build.gradle
          echo "subprojects {" >> android/build.gradle
          echo "    configurations.all {" >> android/build.gradle
          echo "        resolutionStrategy.eachDependency { details ->" >> android/build.gradle
          echo "            if (details.requested.group == 'org.jetbrains.kotlin') {" >> android/build.gradle
          echo "                details.useVersion '1.9.0'" >> android/build.gradle
          echo "            }" >> android/build.gradle
          echo "        }" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle

      - name: Build Signed Release APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevWorldApp
          path: android/app/build/outputs/apk/**/*.apk
          
