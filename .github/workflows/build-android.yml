name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor Core and CLI
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Organize Web Files for Capacitor
        run: |
          mkdir -p www
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'android' ! -name 'www' ! -name 'package.json' ! -name 'package-lock.json' -exec mv -t www/ {} +

      - name: Initialize Capacitor Config
        run: |
          npx --yes @capacitor/cli init "Dev World" com.devworld.app --web-dir www
          npx --yes @capacitor/cli add android
          npx --yes @capacitor/cli sync

      - name: Build Android App (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devworld-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
