<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev World - Studio</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #5ce1e6;
            background-image: url('https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/Untitled338_20260812133205.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #212529;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 15px;
            user-select: none;
            -webkit-user-select: none;
        }

        .clouds-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image: url('https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/Untitled338_20260812133205.png');
            background-repeat: repeat-x;
            background-size: contain;
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border: 4px solid #000000;
            border-radius: 20px;
            box-shadow: 0 8px 0px #000000;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-img {
            max-width: 100px;
            width: 100%;
            height: auto;
            filter: drop-shadow(2px 2px 0px #000);
        }

        .btn-sm {
            padding: 6px 12px;
            border: 2px solid #000;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            background: #ff595e;
            color: #fff;
        }

        .btn-sm:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #000;
        }

        .toolbar-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .input-field {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid #000;
            border-radius: 8px;
            background: #f8f9fa;
            font-weight: 600;
            font-size: 13px;
        }

        .label-title {
            font-size: 10px;
            font-weight: 800;
            display: block;
            margin-bottom: 2px;
        }

        .workspace-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #87CEEB;
            border: 3px solid #000;
            border-radius: 12px;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            touch-action: none;
        }

        #grid-container {
            display: grid;
            gap: 1px;
            background: rgba(0,0,0,0.2);
        }

        .grid-cell {
            background-color: transparent;
            cursor: pointer;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        .category-select {
            width: 100%;
            padding: 8px;
            border: 2px solid #000;
            border-radius: 8px;
            font-weight: 800;
            background: #e9ecef;
            cursor: pointer;
            font-size: 12px;
        }

        .palette-drawer {
            display: flex;
            gap: 8px;
            background: #f8f9fa;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 8px;
            overflow-x: auto;
            min-height: 56px;
            align-items: center;
        }

        .block-option {
            width: 38px;
            height: 38px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            flex-shrink: 0;
        }

        .block-option.selected {
            border-color: #ffb703;
            transform: scale(1.1);
            background-color: #fff3b0;
            box-shadow: 2px 2px 0px #000;
        }

        .block-option img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            pointer-events: none;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-custom {
            flex: 1;
            padding: 10px;
            border: 2px solid #000;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            text-align: center;
        }

        .btn-custom:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #000;
        }

        .btn-publish { background: #55ff55; color: #000; }
        .btn-test { background: #48cae4; color: #000; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #000;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            transition: transform 0.2s ease;
            z-index: 1000;
            border: 2px solid #fff;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body onload="initStudio()">

    <div class="clouds-bg"></div>

    <div class="main-container">
        <div class="nav-row">
            <img src="Devworldlogobeta.png" alt="Dev World" class="logo-img">
            <a href="home.html" class="btn-sm">Exit</a>
        </div>

        <div>
            <label class="label-title">GAME TITLE (REQUIRED)</label>
            <input type="text" id="game-title-input" class="input-field" placeholder="Name your awesome level...">
        </div>

        <div class="toolbar-grid">
            <div>
                <label class="label-title">GRID SIZE (8-32)</label>
                <input type="number" id="grid-size" class="input-field" value="16" min="8" max="32" onchange="resizeGrid()">
            </div>
            <div>
                <label class="label-title">BACKGROUND COLOR</label>
                <input type="color" id="bg-color" class="input-field" value="#87CEEB" onchange="changeBackground()" style="height: 39px; padding: 2px; cursor: pointer;">
            </div>
        </div>

        <div class="workspace-box" id="workspace">
            <div id="grid-container"></div>
        </div>

        <div>
            <label class="label-title">SELECT CATEGORY</label>
            <select id="category-select" class="category-select" onchange="switchCategory()">
                <option value="tiles">🧱 Blocks & Tiles</option>
                <option value="decor">🌿 Decor & Elements</option>
                <option value="traps">⚠️ Hazards & Spikes</option>
            </select>
        </div>

        <div class="palette-drawer" id="palette-drawer"></div>

        <div class="action-buttons">
            <button class="btn-custom btn-test" onclick="testPlay()">Test Play</button>
            <button class="btn-custom btn-publish" onclick="publishGame()">Publish Game</button>
        </div>
    </div>

    <div class="toast" id="toast">Saved!</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDlHHkVs9AVAAknCAMknG_dAYzAIU9eGSA",
            authDomain: "dev-world-c65f5.firebaseapp.com",
            projectId: "dev-world-c65f5",
            storageBucket: "dev-world-c65f5.firebasestorage.app",
            messagingSenderId: "961103609829",
            appId: "1:961103609829:web:ea87f9d0eb63dfde13790c"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        let currentUser = null;
        firebase.auth().onAuthStateChanged((user) => {
            if (user) { currentUser = user; } else { window.location.href = "index.html"; }
        });

        const catalog = {
            tiles: [
                { id: 'grass', name: 'Grass', img: 'https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/Untitled342_20260812162232.png' },
                { id: 'dirt', name: 'Dirt', img: 'https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/Untitled343_20260812162324.png' },
                { id: 'brick', name: 'Brick', img: 'https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/Untitled341_20260812162119.png' },
                { id: 'sand', name: 'Sand', img: 'https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/Untitled360_20260820135759.png' }
            ],
            decor: [
                { id: 'player', name: 'Player Spawn', img: 'https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/Untitled340_20260812161929.png' }
            ],
            traps: [
                { id: 'spike', name: 'Spike', emoji: '⚠️' }
            ]
        };

        let currentSize = 16;
        let currentTileType = 'grass';
        let isDrawing = false;
        let levelData = { playerStart: null, blocks: [] };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function initStudio() {
            switchCategory();
            buildGrid();
        }

        function switchCategory() {
            const cat = document.getElementById('category-select').value;
            const drawer = document.getElementById('palette-drawer');
            drawer.innerHTML = '';

            let eraserDiv = document.createElement('div');
            eraserDiv.className = `block-option ${currentTileType === 'eraser' ? 'selected' : ''}`;
            eraserDiv.innerHTML = '<span style="font-size:14px; font-weight:bold; color:#ff595e;">❌</span>';
            eraserDiv.title = 'Eraser';
            eraserDiv.onclick = () => selectTool('eraser', eraserDiv);
            drawer.appendChild(eraserDiv);

            catalog[cat].forEach(item => {
                let div = document.createElement('div');
                div.className = `block-option ${currentTileType === item.id ? 'selected' : ''}`;
                if (item.img) {
                    div.innerHTML = `<img src="${item.img}" alt="${item.name}">`;
                } else {
                    div.innerHTML = `<span style="font-size:16px;">${item.emoji}</span>`;
                }
                div.title = item.name;
                div.onclick = () => selectTool(item.id, div);
                drawer.appendChild(div);
            });
        }

        function selectTool(type, element) {
            document.querySelectorAll('.block-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            currentTileType = type;
        }

        function changeBackground() {
            const bg = document.getElementById('bg-color').value;
            document.getElementById('workspace').style.backgroundColor = bg;
        }

        function resizeGrid() {
            let val = parseInt(document.getElementById('grid-size').value);
            if (isNaN(val) || val < 8) val = 8;
            if (val > 32) val = 32;
            document.getElementById('grid-size').value = val;
            currentSize = val;
            levelData.blocks = levelData.blocks.filter(b => b.x < currentSize && b.y < currentSize);
            if (levelData.playerStart && (levelData.playerStart.x >= currentSize || levelData.playerStart.y >= currentSize)) {
                levelData.playerStart = null;
            }
            buildGrid();
        }

        function applyCellAction(x, y) {
            if (currentTileType === 'player') {
                levelData.playerStart = { x, y };
            } else if (currentTileType === 'eraser') {
                levelData.blocks = levelData.blocks.filter(b => !(b.x === x && b.y === y));
                if (levelData.playerStart && levelData.playerStart.x === x && levelData.playerStart.y === y) {
                    levelData.playerStart = null;
                }
            } else {
                levelData.blocks = levelData.blocks.filter(b => !(b.x === x && b.y === y));
                levelData.blocks.push({ x, y, type: currentTileType });
            }
            renderCells();
        }

        function renderCells() {
            const container = document.getElementById('grid-container');
            const cells = container.children;
            for (let i = 0; i < cells.length; i++) {
                let cell = cells[i];
                let x = parseInt(cell.dataset.x);
                let y = parseInt(cell.dataset.y);

                cell.style.backgroundImage = '';
                cell.innerHTML = '';

                let block = levelData.blocks.find(b => b.x === x && b.y === y);
                if (block) {
                    if (block.type === 'spike') {
                        cell.innerHTML = '<span style="font-size:12px; display:flex; align-items:center; justify-content:center; height:100%;">⚠️</span>';
                    } else {
                        let flatCat = [...catalog.tiles, ...catalog.decor];
                        let found = flatCat.find(c => c.id === block.type);
                        if (found && found.img) {
                            cell.style.backgroundImage = `url('${found.img}')`;
                        }
                    }
                }

                if (levelData.playerStart && levelData.playerStart.x === x && levelData.playerStart.y === y) {
                    cell.style.backgroundImage = `url('https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/Untitled340_20260812161929.png')`;
                }
            }
        }

        function buildGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            container.style.gridTemplateColumns = `repeat(${currentSize}, minmax(0, 1fr))`;

            let boxSize = 280;
            let cellSize = Math.floor(boxSize / currentSize);

            for (let y = 0; y < currentSize; y++) {
                for (let x = 0; x < currentSize; x++) {
                    let cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    cell.style.width = `${cellSize}px`;
                    cell.style.height = `${cellSize}px`;

                    cell.addEventListener('mousedown', (e) => { e.preventDefault(); isDrawing = true; applyCellAction(x, y); });
                    cell.addEventListener('mouseover', () => { if (isDrawing) applyCellAction(x, y); });
                    
                    cell.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; applyCellAction(x, y); }, { passive: false });
                    cell.addEventListener('touchmove', (e) => {
                        e.preventDefault();
                        if (e.touches && e.touches[0]) {
                            let touch = e.touches[0];
                            let target = document.elementFromPoint(touch.clientX, touch.clientY);
                            if (target && target.classList.contains('grid-cell')) {
                                let tx = parseInt(target.dataset.x);
                                let ty = parseInt(target.dataset.y);
                                if (!isNaN(tx) && !isNaN(ty)) applyCellAction(tx, ty);
                            }
                        }
                    }, { passive: false });

                    container.appendChild(cell);
                }
            }
            renderCells();
        }

        window.addEventListener('mouseup', () => { isDrawing = false; });
        window.addEventListener('touchend', () => { isDrawing = false; });

        function testPlay() {
            sessionStorage.setItem('tempLevelGrid', JSON.stringify({
                cols: currentSize,
                rows: currentSize,
                bgColor: document.getElementById('bg-color').value,
                content: levelData
            }));
            window.location.href = 'play.html?mode=test';
        }

        async function publishGame() {
            if (!currentUser) return;

            const title = document.getElementById('game-title-input').value.trim();
            if (!title) {
                alert("Please enter a custom game title to publish!");
                document.getElementById('game-title-input').focus();
                return;
            }

            const gamePayload = {
                title: title,
                authorId: currentUser.uid,
                creatorId: currentUser.uid,
                genre: "Platformer",
                cols: currentSize,
                rows: currentSize,
                bgColor: document.getElementById('bg-color').value,
                visits: 0,
                content: levelData,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                showToast("Publishing level...");
                await db.collection("games").add(gamePayload);
                showToast("🚀 Published successfully!");
                setTimeout(() => window.location.href = 'home.html', 1500);
            } catch (err) {
                alert("Publish failed: " + err.message);
            }
        }
    </script>
</body>
    </html>
