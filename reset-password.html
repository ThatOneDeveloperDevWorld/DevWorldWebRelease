<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev World - Reset Password</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; }
        
        body {
            background-color: #5ce1e6;
            background-image: url('Untitled338_20260812133205.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #212529;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .clouds-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image: url('Untitled338_20260812133205.png');
            background-repeat: repeat-x;
            background-size: contain;
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
        }

        .main-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border: 4px solid #000000;
            border-radius: 20px;
            box-shadow: 0 8px 0px #000000;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        .logo-img {
            max-width: 140px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            filter: drop-shadow(2px 2px 0px #000);
        }

        .card-title {
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0;
        }

        .card-text {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin: 0;
            line-height: 1.4;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border: 2px solid #000;
            border-radius: 10px;
            background: #f8f9fa;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-custom {
            width: 100%;
            padding: 12px;
            border: 2px solid #000;
            border-radius: 10px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            text-align: center;
            text-decoration: none;
        }

        .btn-custom:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #000;
        }

        .btn-submit { background: #55ff55; color: #000; }
        .btn-back { background: #ff6b6b; color: #fff; margin-top: 5px; display: inline-block; }
    </style>
</head>
<body>

    <div class="clouds-bg"></div>

    <div class="main-card">
        <img src="Devworldlogobeta.png" alt="Dev World" class="logo-img">
        <h2 class="card-title">Reset Password</h2>
        <p class="card-text">Enter your account email address below, and we'll send you a secure link to reset your password.</p>

        <input type="email" id="reset-email" class="input-field" placeholder="Enter your email...">

        <button class="btn-custom btn-submit" onclick="sendResetEmail()">Send Reset Link</button>
        <a href="index.html" class="btn-custom btn-back">Back to Login</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDlHHkVs9AVAAknCAMknG_dAYzAIU9eGSA",
            authDomain: "dev-world-c65f5.firebaseapp.com",
            projectId: "dev-world-c65f5",
            storageBucket: "dev-world-c65f5.firebasestorage.app",
            messagingSenderId: "961103609829",
            appId: "1:961103609829:web:ea87f9d0eb63dfde13790c"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        auth.useDeviceLanguage();

        function sendResetEmail() {
            const emailInput = document.getElementById('reset-email');
            const email = emailInput.value.trim();

            if (!email) {
                alert("Please enter your email address.");
                emailInput.focus();
                return;
            }

            auth.sendPasswordResetEmail(email)
                .then(() => {
                    alert("Password reset email sent! Check your inbox.");
                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    console.error("Password reset error:", error);
                    alert("Error: " + error.message);
                });
        }
    </script>
</body>
</html>
