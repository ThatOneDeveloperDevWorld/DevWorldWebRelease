<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev World - Home</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; }
        
        body {
            background-color: #5ce1e6;
            background-image: url('https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/Untitled338_20260812133205.png?raw=true');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #212529;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 90px;
        }

        .clouds-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image: url('https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/Untitled338_20260812133205.png?raw=true');
            background-repeat: repeat-x;
            background-size: contain;
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
        }

        .fullscreen-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            border: 3px solid #000000;
            border-radius: 14px;
            box-shadow: 0 5px 0px #000000;
            padding: 12px 18px;
        }

        .logo-img {
            max-width: 120px;
            width: 100%;
            height: auto;
            filter: drop-shadow(2px 2px 0px #000);
        }

        .search-box {
            display: flex;
            gap: 8px;
            background: #ffffff;
            border: 3px solid #000000;
            border-radius: 14px;
            box-shadow: 0 5px 0px #000000;
            padding: 12px 18px;
        }

        .input-field {
            flex: 1;
            padding: 10px;
            border: 2px solid #000;
            border-radius: 8px;
            background: #f8f9fa;
            font-weight: 600;
            font-size: 13px;
        }

        .btn-search {
            padding: 10px 16px;
            border: 2px solid #000;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            background: #ffb703;
            box-shadow: 2px 2px 0px #000;
        }

        .section-title {
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            margin: 5px 0 0 0;
            color: #000;
            background: #ffffff;
            border: 3px solid #000;
            display: inline-block;
            padding: 5px 12px;
            border-radius: 8px;
            box-shadow: 2px 2px 0px #000;
            align-self: flex-start;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            width: 100%;
        }

        .game-card-square {
            aspect-ratio: 1 / 1;
            background: #f8f9fa;
            border: 2.5px solid #000;
            border-radius: 10px;
            box-shadow: 3px 3px 0px #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            text-decoration: none;
            color: #000;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .game-card-square:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #000;
            background: #fff;
        }

        .game-card-top {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .game-card-title {
            font-weight: 800;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .game-card-author {
            font-size: 9px;
            font-weight: 700;
            color: #555;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .game-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 9px;
            font-weight: bold;
        }

        .visits-count {
            color: #333;
            background: #e9ecef;
            padding: 2px 5px;
            border-radius: 4px;
            border: 1px solid #000;
        }

        .play-tag {
            background: #55ff55;
            border: 1.5px solid #000;
            padding: 2px 6px;
            border-radius: 4px;
            box-shadow: 1.5px 1.5px 0px #000;
        }

        .loading-text {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #000;
            background: #fff;
            border: 3px solid #000;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 3px 3px 0px #000;
        }

        /* Fixed Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            box-shadow: 0 -4px 0px #000000;
            border-top: 3px solid #000000;
            z-index: 1000;
        }

        .nav-item {
            background: #f8f9fa;
            border: 2px solid #000;
            border-radius: 8px;
            color: #000;
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 16px;
            box-shadow: 2px 2px 0px #000;
            text-decoration: none;
            transition: transform 0.1s ease;
        }

        .nav-item:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #000;
        }

        .nav-wallet { background: #ffb703; }
        .nav-create { background: #55ff55; }
        .nav-profile { background: #48cae4; }

        /* Popup Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: #ffffff;
            border: 3px solid #000;
            border-radius: 14px;
            box-shadow: 5px 5px 0px #000;
            width: 100%;
            max-width: 360px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 900;
            margin: 0;
        }

        .modal-text {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin: 0;
            line-height: 1.4;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #000;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            transition: transform 0.1s ease;
        }

        .modal-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #000;
        }

        .btn-cancel { background: #ff6b6b; color: #fff; }
        .btn-confirm { background: #55ff55; color: #000; }
    </style>
</head>
<body onload="initHome()">

    <div class="clouds-bg"></div>

    <div class="fullscreen-container">
        <div class="nav-row">
            <img src="Devworldlogobeta.png" alt="Dev World" class="logo-img">
        </div>

        <div class="search-box">
            <input type="text" id="search-username-input" class="input-field" placeholder="Search username...">
            <button class="btn-search" onclick="searchUser()">Find</button>
        </div>

        <h3 class="section-title">All Games</h3>
        
        <div class="games-grid" id="games-container">
            <div class="loading-text">Loading...</div>
        </div>
    </div>

    <!-- Bottom Navigation Bar with Wallet, Create (in middle), and Profile -->
    <nav class="bottom-nav">
        <a href="wallet.html" class="nav-item nav-wallet">
            <span>💰</span>
            Wallet
        </a>
        <button type="button" class="nav-item nav-create" onclick="openCreateModal()">
            <span>✏️</span>
            Create
        </button>
        <a href="profile.html" class="nav-item nav-profile">
            <span>👤</span>
            Profile
        </a>
    </nav>

    <!-- Create Confirmation Popup Modal -->
    <div class="modal-overlay" id="createModal">
        <div class="modal-box">
            <h3 class="modal-title">Create Game</h3>
            <p class="modal-text">Create a new game? Once published, this game will be public to everyone on Dev world.</p>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeCreateModal()">Cancel</button>
                <button class="modal-btn btn-confirm" onclick="confirmCreate()">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDlHHkVs9AVAAknCAMknG_dAYzAIU9eGSA",
            authDomain: "dev-world-c65f5.firebaseapp.com",
            projectId: "dev-world-c65f5",
            storageBucket: "dev-world-c65f5.firebasestorage.app",
            messagingSenderId: "961103609829",
            appId: "1:961103609829:web:ea87f9d0eb63dfde13790c"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();

        const userCache = {};

        async function getCreatorUsername(authorId) {
            if (!authorId) return "Unknown";
            if (userCache[authorId]) return userCache[authorId];

            try {
                let userDoc = await db.collection("users").doc(authorId).get();
                if (userDoc.exists) {
                    let uData = userDoc.data();
                    let name = uData.Username || uData.username || "Unknown";
                    userCache[authorId] = name;
                    return name;
                }

                let qSnap = await db.collection("users").where("uid", "==", authorId).get();
                if (!qSnap.empty) {
                    let uData = qSnap.docs[0].data();
                    let name = uData.Username || uData.username || "Unknown";
                    userCache[authorId] = name;
                    return name;
                }
            } catch (err) {
                console.error("Error fetching creator name:", err);
            }
            return "Developer";
        }

        async function searchUser() {
            const queryName = document.getElementById('search-username-input').value.trim();
            if (!queryName) {
                alert("Please enter a username.");
                return;
            }

            try {
                const querySnapshot = await db.collection("users").where("Username", "==", queryName).get();
                if (!querySnapshot.empty) {
                    window.location.href = `userprofile.html?id=${querySnapshot.docs[0].id}`;
                    return;
                }

                const querySnapshotLower = await db.collection("users").where("username", "==", queryName).get();
                if (!querySnapshotLower.empty) {
                    window.location.href = `userprofile.html?id=${querySnapshotLower.docs[0].id}`;
                    return;
                }

                alert("User not found!");
            } catch (error) {
                console.error("Error searching user:", error);
                alert("Lookup failed.");
            }
        }

        async function initHome() {
            const container = document.getElementById('games-container');
            try {
                const snapshot = await db.collection("games").orderBy("createdAt", "desc").get();
                container.innerHTML = '';

                if (snapshot.empty) {
                    container.innerHTML = '<div class="loading-text">No games published yet.</div>';
                    return;
                }

                for (let doc of snapshot.docs) {
                    const game = doc.data();
                    const gameId = doc.id;
                    const publisherId = game.authorId || game.creatorId;

                    const creatorName = await getCreatorUsername(publisherId);

                    const card = document.createElement('a');
                    card.className = 'game-card-square';
                    card.href = `play.html?id=${gameId}`;

                    const topDiv = document.createElement('div');
                    topDiv.className = 'game-card-top';

                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'game-card-title';
                    titleDiv.innerText = game.title || "Untitled Level";

                    const authorDiv = document.createElement('div');
                    authorDiv.className = 'game-card-author';
                    authorDiv.innerText = `by ${creatorName}`;

                    topDiv.appendChild(titleDiv);
                    topDiv.appendChild(authorDiv);

                    const footerDiv = document.createElement('div');
                    footerDiv.className = 'game-card-footer';
                    
                    const visitsSpan = document.createElement('span');
                    visitsSpan.className = 'visits-count';
                    visitsSpan.innerText = `👁️ ${game.visits || 0}`;

                    const playSpan = document.createElement('span');
                    playSpan.className = 'play-tag';
                    playSpan.innerText = 'Play ▶';

                    footerDiv.appendChild(visitsSpan);
                    footerDiv.appendChild(playSpan);

                    card.appendChild(topDiv);
                    card.appendChild(footerDiv);
                    container.appendChild(card);
                }
            } catch (error) {
                console.error("Error loading games feed:", error);
                container.innerHTML = '<div class="loading-text" style="color:red;">Failed to load games.</div>';
            }
        }

        function openCreateModal() {
            document.getElementById('createModal').style.display = 'flex';
        }

        function closeCreateModal() {
            document.getElementById('createModal').style.display = 'none';
        }

        function confirmCreate() {
            window.location.href = 'editor.html';
        }
    </script>
</body>
</html>
