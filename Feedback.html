<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev World - Feedback</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; }
        
        body {
            background-color: #5ce1e6;
            background-image: url('https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/Untitled338_20260812133205.png?raw=true');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #212529;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .clouds-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image: url('https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/Untitled338_20260812133205.png?raw=true');
            background-repeat: repeat-x;
            background-size: contain;
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border: 4px solid #000000;
            border-radius: 20px;
            box-shadow: 0 8px 0px #000000;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .logo-img {
            max-width: 160px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(3px 3px 0px #000);
        }

        .label-title {
            font-size: 11px;
            font-weight: 800;
            display: block;
            margin-bottom: 4px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border: 2px solid #000;
            border-radius: 8px;
            background: #f8f9fa;
            font-weight: 600;
            font-size: 14px;
            font-family: inherit;
        }

        .btn-custom {
            width: 100%;
            padding: 12px;
            border: 2px solid #000;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            transition: transform 0.1s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-custom:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        .btn-submit { background: #55ff55; color: #000; }
        .btn-back { background: #ff595e; color: #fff; }
    </style>
</head>
<body>

    <div class="clouds-bg"></div>

    <div class="main-container">
        <!-- Top feedback menu image with fallback -->
        <img src="people.png" alt="Feedback Menu" class="logo-img" onerror="this.src='Devworldlogobeta.png'">
        
        <div>
            <label class="label-title">CATEGORY</label>
            <select id="feedback-category" class="input-field">
                <option value="General">General</option>
                <option value="Editor">Editor</option>
                <option value="UI">UI</option>
                <option value="Issues">Issues</option>
                <option value="Account">Account</option>
                <option value="Games">Games</option>
                <option value="Moderation">Moderation</option>
                <option value="Ideas">Ideas</option>
                <option value="Others">Others</option>
            </select>
        </div>

        <div>
            <label class="label-title">YOUR FEEDBACK</label>
            <textarea id="feedback-message" class="input-field" rows="4" placeholder="Tell us what you think or report a bug..." style="resize: none;"></textarea>
        </div>

        <button class="btn-custom btn-submit" onclick="sendFeedback()">Send Feedback</button>
        <a href="home.html" class="btn-custom btn-back">Back to Home</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDlHHkVs9AVAAknCAMknG_dAYzAIU9eGSA",
            authDomain: "dev-world-c65f5.firebaseapp.com",
            projectId: "dev-world-c65f5",
            storageBucket: "dev-world-c65f5.firebasestorage.app",
            messagingSenderId: "961103609829",
            appId: "1:961103609829:web:ea87f9d0eb63dfde13790c"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1559152474949161092/EOLeK8sHON43NA_NhPKOgpYwDt5H7xVM5fMGnu78R9dAliXhP3uJpqGWOs_hawbXJQ49";

        async function sendFeedback() {
            const user = auth.currentUser;
            const category = document.getElementById('feedback-category').value;
            const message = document.getElementById('feedback-message').value.trim();

            if (!message) {
                alert("Please enter a feedback message before sending.");
                return;
            }

            // Identify user ID for profile link (falls back to guest if unauthenticated)
            const userId = user ? user.uid : "guest";
            const profileLink = `https://devworld.run.place/userprofile.html?id=${userId}`;

            // Build payload matching your exact template format
            const discordPayload = {
                content: "<@&1563290842108788787>",
                embeds: [
                    {
                        description: `> **Category - ${category}**\n> **${message}**\n\n> **Sent by ${profileLink}**`,
                        color: 5639675 // Clean accent color
                    }
                ]
            };

            try {
                const response = await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(discordPayload)
                });

                if (response.ok || response.status === 204) {
                    alert("Thank you! Your feedback has been sent successfully.");
                    document.getElementById('feedback-message').value = '';
                } else {
                    alert("Failed to send feedback to Discord. Please try again later.");
                }
            } catch (error) {
                console.error("Webhook error:", error);
                alert("An error occurred while submitting feedback.");
            }
        }
    </script>
</body>
</html>
