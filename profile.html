<script>
        const firebaseConfig = {
            apiKey: "AIzaSyDlHHkVs9AVAAknCAMknG_dAYzAIU9eGSA",
            authDomain: "dev-world-c65f5.firebaseapp.com",
            projectId: "dev-world-c65f5",
            storageBucket: "dev-world-c65f5.firebasestorage.app",
            messagingSenderId: "961103609829",
            appId: "1:961103609829:web:ea87f9d0eb63dfde13790c"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();
        db.settings({ experimentalForceLongPolling: true });

        // Ensure persistence is set to LOCAL
        firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
            .catch((error) => {
                console.warn("Auth persistence error:", error.message);
            });

        function handleUserRedirect(user) {
            db.collection("users").doc(user.uid).get().then((doc) => {
                if (doc.exists && doc.data().isBanned === true) {
                    window.location.href = "ban.html";
                } else {
                    window.location.href = "profile.html";
                }
            }).catch((error) => {
                console.error("Error checking user status:", error);
                window.location.href = "profile.html";
            });
        }

        // REMOVED the aggressive auto-redirect on index.html so users can actually view the landing page 
        // without getting bounced automatically if a session token exists. 
        // Instead, handle user redirection only after intentional login/signup actions.

        // 1. Initial Start Button Menu Popup via Engine
        document.getElementById('open-start-btn').addEventListener('click', () => {
            // If user is already logged in, go straight to profile when clicking START
            const currentUser = firebase.auth().currentUser;
            if (currentUser) {
                handleUserRedirect(currentUser);
                return;
            }

            dev.createpopup({
                title: "Welcome to Dev World",
                buttons: {
                    "btn-create": {
                        text: "Create Account",
                        color: "#5ce1e6",
                        textColor: "#000000",
                        onClick: () => openSignupPopup()
                    },
                    "btn-login": {
                        text: "Login",
                        color: "#5ce1e6",
                        textColor: "#000000",
                        onClick: () => openLoginPopup()
                    }
                }
            });
        });
