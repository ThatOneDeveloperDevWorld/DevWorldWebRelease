<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev World v0.1.5</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #5ce1e6;
            background-image: url('');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #212529;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .clouds-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image: url('https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/Untitled338_20260812133205.png?raw=true');
            background-repeat: repeat-x;
            background-size: contain;
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
        }

        .top-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .logo-img {
            max-width: 280px;
            width: 100%;
            height: auto;
            margin-bottom: 5px;
            filter: drop-shadow(3px 3px 0px #000);
        }

        .version-text {
            font-size: 14px;
            font-weight: 800;
            color: #000;
        }

        .center-container {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        .btn-start {
            width: 100%;
            max-width: 320px;
            padding: 16px;
            background: #cceecc;
            color: #000000;
            border: 4px solid #000000;
            border-radius: 30px;
            font-weight: 900;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 6px 0px #000000;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            text-align: center;
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #000000;
        }

        /* Modal Overlay Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #ffffff;
            border: 4px solid #000000;
            border-radius: 20px;
            box-shadow: 0 8px 0px #000000;
            width: 90%;
            max-width: 380px;
            padding: 30px 20px;
            position: relative;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .close-modal {
            position: absolute;
            top: 12px;
            right: 15px;
            background: #ff5964;
            color: #fff;
            border: 2px solid #000;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border: 2px solid #000;
            border-radius: 8px;
            background: #f8f9fa;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-custom {
            width: 100%;
            padding: 12px;
            border: 2px solid #000;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            transition: transform 0.1s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-custom:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        .btn-login-submit { background: #38b000; color: #fff; margin-bottom: 12px; }
        .btn-google { background: #ffffff; color: #000; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 5px; }

        .footer-scene {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 600px;
            height: auto;
            display: flex;
            justify-content: center;
        }

        .footer-img {
            width: 100%;
            height: auto;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <div class="clouds-bg"></div>

    <div class="top-container">
        <img src="https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/logo1.png?raw=true" alt="Dev World Logo" class="logo-img" onerror="this.src='Devworldlogobeta.png'">
        <div class="version-text">v0.1.5</div>
    </div>

    <div class="center-container">
        <button id="open-modal-btn" class="btn-start">START!</button>
    </div>

    <div class="footer-scene">
        <img src="https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/screenlogin1.png?raw=true" alt="Characters and Scenery" class="footer-img" onerror="">
    </div>

    <!-- Login Popup Modal -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content">
            <button id="close-modal-btn" class="close-modal">X</button>
            <h3 style="margin-top: 0; margin-bottom: 20px; font-weight: 900;">Welcome to Dev World</h3>

            <input type="email" id="email-input" class="input-field" placeholder="Email address">
            <input type="password" id="pass-input" class="input-field" placeholder="Password">
            <button id="login-btn" class="btn-custom btn-login-submit">Login / Register</button>
            
            <div style="margin: 15px 0; font-weight: 700; font-size: 12px; color: #666;">OR</div>

            <button id="google-login-btn" class="btn-custom btn-google">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.08-1.82 2.72v2.26h2.94c1.72-1.58 2.78-3.9 2.78-6.63z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.94-2.26c-.81.54-1.84.86-3.02.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.45 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.75c-.18-.54-.28-1.12-.28-1.75s.1-1.21.28-1.75V4.92H.96C.35 6.13 0 7.51 0 9s.35 2.87.96 4.08l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.02.96 4.92l3.01 2.33c.71-2.13 2.69-3.67 5.03-3.67z"/></svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDlHHkVs9AVAAknCAMknG_dAYzAIU9eGSA",
            authDomain: "dev-world-c65f5.firebaseapp.com",
            projectId: "dev-world-c65f5",
            storageBucket: "dev-world-c65f5.firebasestorage.app",
            messagingSenderId: "961103609829",
            appId: "1:961103609829:web:ea87f9d0eb63dfde13790c"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();

        // Modal Open/Close Controls
        const modal = document.getElementById('auth-modal');
        document.getElementById('open-modal-btn').addEventListener('click', () => {
            modal.classList.add('active');
        });
        document.getElementById('close-modal-btn').addEventListener('click', () => {
            modal.classList.remove('active');
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                window.location.href = "profile.html";
            }
        });

        // Email/Password Login
        document.getElementById("login-btn").addEventListener("click", () => {
            const email = document.getElementById("email-input").value;
            const pass = document.getElementById("pass-input").value;

            if (!email || !pass) {
                alert("Please enter both email and password.");
                return;
            }

            firebase.auth().signInWithEmailAndPassword(email, pass)
            .then(() => {
                window.location.href = "profile.html";
            })
            .catch(() => {
                return firebase.auth().createUserWithEmailAndPassword(email, pass);
            })
            .then((userCredential) => {
                if (userCredential && userCredential.user) {
                    const user = userCredential.user;
                    return db.collection("users").doc(user.uid).set({
                        Username: "DevWorldUser",
                        Bio: "nothing... :/",
                        Projects: []
                    }, { merge: true }).then(() => {
                        window.location.href = "home.html";
                    });
                }
            })
            .catch((error) => {
                alert("Error: " + error.message);
            });
        });

        // Google Sign-In with Popup & Account Selector Prompt
        document.getElementById("google-login-btn").addEventListener("click", () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });

            firebase.auth().signInWithPopup(provider)
            .then((result) => {
                const user = result.user;
                const userRef = db.collection("users").doc(user.uid);
                
                return userRef.get().then((doc) => {
                    if (!doc.exists) {
                        return userRef.set({
                            Username: user.displayName || "DevWorldUser",
                            Bio: "this user didnt leave a bio for you to read.",
                            Projects: []
                        });
                    }
                }).then(() => {
                    window.location.href = "home.html";
                });
            })
            .catch((error) => {
                alert("Google Sign-In failed: " + error.message);
            });
        });
    </script>
</body>
</html>
