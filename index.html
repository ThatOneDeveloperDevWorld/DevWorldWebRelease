<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev World v0.2.0</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #87f2b7;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Cherry Bomb One', cursive, sans-serif;
        }

        .mobile-app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            background-color: #87f2b7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-y: auto;
            border: none;
            box-shadow: none;
            padding: 20px 10px;
        }

        .clouds-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/Untitled338_20260812133205.png?raw=true');
            background-repeat: repeat;
            background-size: 400px;
            opacity: 0.3;
            pointer-events: none;
            z-index: 1;
        }

        .top-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 4vh;
        }

        .logo-img {
            max-width: 220px;
            width: 80%;
            height: auto;
            margin-bottom: 5px;
            filter: drop-shadow(3px 3px 0px #000);
        }

        .version-text {
            font-size: 15px;
            letter-spacing: 1px;
            color: #000;
        }

        .center-container {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 2vh;
        }

        .btn-start {
            width: 100%;
            max-width: 260px;
            padding: 12px;
            background: #cceecc;
            color: #000000;
            border: 4px solid #000000;
            border-radius: 20px;
            font-family: 'Cherry Bomb One', cursive, sans-serif;
            font-size: 22px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 0px #000000;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            text-align: center;
        }

        .btn-start:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #000000;
        }

        .footer-scene {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            margin-bottom: 1vh;
        }

        .footer-img {
            width: 85%;
            height: auto;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <div class="mobile-app-container">
        <div class="clouds-bg"></div>

        <div class="top-container">
            <img src="https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/logo1.png?raw=true" alt="Dev World Logo" class="logo-img" onerror="this.src='Devworldlogobeta.png'">
            <div class="version-text">v0.2.0</div>
        </div>

        <div class="center-container">
            <button id="open-start-btn" class="btn-start">START!</button>
        </div>

        <div class="footer-scene">
            <img src="https://github.com/ThatOneDeveloperDevWorld/devworldsource/blob/main/screenlogin1.png?raw=true" alt="Characters and Scenery" class="footer-img">
        </div>
    </div>

    <!-- Load the custom Dev World Engine -->
    <script src="devworldeng.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDlHHkVs9AVAAknCAMknG_dAYzAIU9eGSA",
            authDomain: "dev-world-c65f5.firebaseapp.com",
            projectId: "dev-world-c65f5",
            storageBucket: "dev-world-c65f5.firebasestorage.app",
            messagingSenderId: "961103609829",
            appId: "1:961103609829:web:ea87f9d0eb63dfde13790c"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();
        db.settings({ experimentalForceLongPolling: true });

        // Fix for file:// protocol: Set Auth Persistence to NONE or SESSION so it doesn't crash on local file origins
        firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION)
            .catch((error) => {
                console.warn("Auth persistence error (file:// fallback active):", error.message);
            });

        // Helper function to handle user redirection based on ban status
        function handleUserRedirect(user) {
            db.collection("users").doc(user.uid).get().then((doc) => {
                if (doc.exists && doc.data().isBanned === true) {
                    window.location.href = "ban.html";
                } else {
                    window.location.href = "profile.html";
                }
            }).catch((error) => {
                console.error("Error checking user status:", error);
                window.location.href = "profile.html";
            });
        }

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                handleUserRedirect(user);
            }
        });

        // 1. Initial Start Button Menu Popup via Engine
        document.getElementById('open-start-btn').addEventListener('click', () => {
            dev.createpopup({
                title: "Welcome to Dev World",
                buttons: {
                    "btn-create": {
                        text: "Create Account",
                        color: "#5ce1e6", // Light cyan for Create Account
                        textColor: "#000000",
                        onClick: () => openSignupPopup()
                    },
                    "btn-login": {
                        text: "Login",
                        color: "#5ce1e6", // Light cyan for Login
                        textColor: "#000000",
                        onClick: () => openLoginPopup()
                    }
                }
            });
        });

        // 2. Signup Popup generated via engine configuration
        function openSignupPopup() {
            dev.createpopup({
                title: "Create Account",
                inputs: {
                    "signup-username": { type: "text", placeholder: "Username" },
                    "signup-email": { type: "email", placeholder: "Email address" },
                    "signup-pass": { type: "password", placeholder: "Password" }
                },
                buttons: {
                    "btn-signup": {
                        text: "Sign Up",
                        color: "#38b000", // Left original green for form submit
                        textColor: "#fff",
                        onClick: () => {
                            const username = document.getElementById("signup-username").value.trim();
                            const email = document.getElementById("signup-email").value.trim();
                            const pass = document.getElementById("signup-pass").value;

                            if (!username) {
                                alert("Please enter a username.");
                                document.getElementById("signup-username").focus();
                                return;
                            }
                            if (!email || !pass) {
                                alert("Please enter both email and password.");
                                return;
                            }

                            firebase.auth().createUserWithEmailAndPassword(email, pass)
                            .then((userCredential) => {
                                const user = userCredential.user;
                                return db.collection("users").doc(user.uid).set({
                                    Username: username,
                                    Bio: "nothing... :/",
                                    Projects: [],
                                    isBanned: false
                                }, { merge: true }).then(() => {
                                    handleUserRedirect(user);
                                });
                            })
                            .catch((error) => {
                                alert("Error: " + error.message);
                            });
                        }
                    }
                },
                footerHtml: `
                    <div style="font-size: 11px; color: #666; margin: 4px 0 8px 0;">OR</div>
                    <button class="btn-custom google-auth-btn" style="background: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px;">
                        <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.08-1.82 2.72v2.26h2.94c1.72-1.58 2.78-3.9 2.78-6.63z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.94-2.26c-.81.54-1.84.86-3.02.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.45 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.75c-.18-.54-.28-1.12-.28-1.75s.1-1.21.28-1.75V4.92H.96C.35 6.13 0 7.51 0 9s.35 2.87.96 4.08l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.02.96 4.92l3.01 2.33c.71-2.13 2.69-3.67 5.03-3.67z"/></svg>
                        Sign up with Google
                    </button>
                `
            });
            attachGoogleAuthListener();
        }

        // 3. Login Popup generated via engine configuration
        function openLoginPopup() {
            dev.createpopup({
                title: "Login to Account",
                inputs: {
                    "login-email": { type: "email", placeholder: "Email address" },
                    "login-pass": { type: "password", placeholder: "Password" }
                },
                buttons: {
                    "btn-login": {
                        text: "Login",
                        color: "#38b000", // Left original green for form submit
                        textColor: "#fff",
                        onClick: () => {
                            const email = document.getElementById("login-email").value.trim();
                            const pass = document.getElementById("login-pass").value;

                            if (!email || !pass) {
                                alert("Please enter both email and password.");
                                return;
                            }

                            firebase.auth().signInWithEmailAndPassword(email, pass)
                            .then((userCredential) => {
                                handleUserRedirect(userCredential.user);
                            })
                            .catch((error) => {
                                alert("Error: " + error.message);
                            });
                        }
                    }
                },
                footerHtml: `
                    <button type="button" style="font-size: 13px; color: #0077b6; background: none; border: none; cursor: pointer; text-decoration: underline; margin-bottom: 6px; font-family: 'Cherry Bomb One', cursive, sans-serif;" onclick="triggerPasswordReset()">Forgot password?</button>
                    <div style="font-size: 11px; color: #666; margin: 4px 0 8px 0;">OR</div>
                    <button class="btn-custom google-auth-btn" style="background: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px;">
                        <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.08-1.82 2.72v2.26h2.94c1.72-1.58 2.78-3.9 2.78-6.63z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.94-2.26c-.81.54-1.84.86-3.02.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.45 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.75c-.18-.54-.28-1.12-.28-1.75s.1-1.21.28-1.75V4.92H.96C.35 6.13 0 7.51 0 9s.35 2.87.96 4.08l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.02.96 4.92l3.01 2.33c.71-2.13 2.69-3.67 5.03-3.67z"/></svg>
                        Sign in with Google
                    </button>
                `
            });
            attachGoogleAuthListener();
        }

        function triggerPasswordReset() {
            const emailInput = document.getElementById('login-email');
            const email = emailInput ? emailInput.value.trim() : '';

            if (!email) {
                alert("Please enter your email address in the login email field first, then click 'Forgot password?'.");
                if (emailInput) emailInput.focus();
                return;
            }

            firebase.auth().sendPasswordResetEmail(email)
                .then(() => {
                    alert("Password reset email sent! Check your inbox.");
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        }

        // Re-attach Google Auth listener to dynamically created engine buttons
        function attachGoogleAuthListener() {
            document.querySelectorAll('.google-auth-btn').forEach(btn => {
                btn.addEventListener("click", () => {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    provider.setCustomParameters({ prompt: 'select_account' });

                    firebase.auth().signInWithPopup(provider)
                    .then((result) => {
                        const user = result.user;
                        const userRef = db.collection("users").doc(user.uid);
                        
                        return userRef.get().then((doc) => {
                            if (!doc.exists) {
                                return userRef.set({
                                    Username: user.displayName || "DevWorldUser",
                                    Bio: "this user didnt leave a bio for you to read.",
                                    Projects: [],
                                    isBanned: false
                                });
                            }
                        }).then(() => {
                            handleUserRedirect(user);
                        });
                    })
                    .catch((error) => {
                        alert("Google Sign-In failed: " + error.message);
                    });
                });
            });
        }
    </script>
</body>
</html>
