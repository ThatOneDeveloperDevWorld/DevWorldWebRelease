<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reported Post Review - Dev World</title>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #5ce1e6;
            font-family: 'Cherry Bomb One', cursive, sans-serif;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            border: 3px solid #000;
            border-radius: 14px;
            box-shadow: 5px 5px 0px #000;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h2 { margin-top: 0; text-transform: uppercase; }
        .info-box {
            background: #f8f9fa;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-family: sans-serif;
        }
        .btn {
            background: #ff595e;
            color: #fff;
            border: 2px solid #000;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Cherry Bomb One', cursive, sans-serif;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            text-align: center;
            text-decoration: none;
        }
        .btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px #000; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Reported Post Inspection</h2>
        
        <div class="info-box">
            <p><strong>Reporter:</strong> <span id="display-reporter">Loading...</span></p>
            <p><strong>Post ID:</strong> <span id="display-postid">Loading...</span></p>
            <p><strong>Creator ID:</strong> <span id="display-creatorid">Loading...</span></p>
        </div>

        <div>
            <p style="margin: 0 0 5px 0; font-size: 14px;">Report Message / Content:</p>
            <div id="display-reportmsg" class="info-box" style="background: #fff3f3; min-height: 60px; font-weight: bold;">Loading...</div>
        </div>

        <a href="home.html" class="btn">Return to Home</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const reporter = params.get('reporter') || 'Unknown';
        const reportMsg = params.get('reportmsg') || 'No details provided';
        const postId = params.get('postid') || 'N/A';
        const creatorId = params.get('creatorid') || 'N/A';

        document.getElementById('display-reporter').innerText = reporter;
        document.getElementById('display-reportmsg').innerText = reportMsg;
        document.getElementById('display-postid').innerText = postId;
        document.getElementById('display-creatorid').innerText = creatorId;
    </script>
</body>
</html>
